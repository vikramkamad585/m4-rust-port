version = "1.0"

[task]
name = "afterquery/recutils-recsel-rs"
description = "Reimplement GNU recutils 1.9's query tools (recsel, recinf, recfmt, rec2csv) as one dependency-free Rust binary; graded byte-for-byte against the real tools on 1,795 sealed invocations."

[metadata]
paradigm = "implementation"
compute = "cpu"
languages = ["rust"]
category = "data-tools"
difficulty = "frontier"
tags = ["recutils", "plain-text-database", "query-language", "parser", "port", "differential-testing"]
oracle_reward_threshold = 1.0

[agent]
timeout_sec = 28800

[verifier]
timeout_sec = 3600

[environment]
allow_internet = false
cpus = 4
memory_mb = 8192
gpus = 0

[environment.env]
TASK_BUDGET_SECS = "28800"
